<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fourth Café — Programa de fidelización</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="stage">
  <div class="phone">
    <header class="app-header">
      <div class="logo">Fourth Café</div>
      <button class="icon-btn" id="bell" aria-label="Notificaciones"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 17V11a6 6 0 0 1 12 0v6l2 2H4z"/><path d="M10 21h4"/></svg><i></i></button>
    </header>
    <div class="app-scroll">
      <section class="points">
        <h1>Hola, Alan 👋</h1>
        <p>Tus puntos actuales</p>
        <div class="big"><b id="pts">450</b><span>puntos</span></div>
        <div class="bar" role="progressbar" aria-valuenow="450" aria-valuemin="0" aria-valuemax="1000"><div id="fill"></div></div>
        <small>Faltan 550 puntos para tu recompensa de $10</small>
      </section>
      <section class="card">
        <h2>Tus beneficios</h2>
        <button class="reward" data-modal="reward">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#E9AE32" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8c-3 0-4-4-1.5-4S12 8 12 8zM12 8c3 0 4-4 1.5-4S12 8 12 8z"/></svg>
          <span><b>$10 de descuento</b><small>Canjea con 1,000 puntos</small></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <h2 style="margin-top:20px">Promociones para ti</h2>
        <div class="promo"><h3>2x1 en cafés</h3><p>Solo esta semana</p><button class="btn" data-toast="¡Promoción activada! Preséntala en caja.">¡Aprovecha!</button></div>
      </section>
    </div>
    <nav class="tabbar" aria-label="Navegación principal">
      <button class="on" data-tab="Inicio">Inicio</button>
      <button data-tab="Mis recompensas">Mis recompensas</button>
      <button data-tab="Promociones">Promociones</button>
      <button data-tab="Perfil">Perfil</button>
    </nav>
  </div>
  <a class="admin-link" href="dashboard.html">Dashboard administrativo</a>
</main>
<div id="modal-root"></div>
<script src="js/app.js"></script>
</body>
</html>
